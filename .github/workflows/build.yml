name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  companion:
    name: Companion (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: translate-companion.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: translate-companion
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: translate-companion
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: translate-companion
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion -> target
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.name == 'linux-x64'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Archive before upload so the Mac and Linux binaries keep their execute bit.
      - name: Package
        run: |
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} ../dist/
          cd ../dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../translate-companion-${{ matrix.name }}.zip ${{ matrix.exe }}
          else
            tar czf ../translate-companion-${{ matrix.name }}.tar.gz ${{ matrix.exe }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: translate-companion-${{ matrix.name }}
          path: translate-companion-${{ matrix.name }}.*

  addon:
    name: Addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          for f in addon/Translate/*.lua; do luac5.1 -p "$f"; done
      - name: Package
        run: cd addon && zip -r ../Translate-addon.zip Translate
      - uses: actions/upload-artifact@v4
        with:
          name: Translate-addon
          path: Translate-addon.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [companion, addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
