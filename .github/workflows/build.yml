name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  companion:
    name: Companion (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: translate-companion.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: translate-companion
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: translate-companion
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: translate-companion
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion -> target
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.name == 'linux-x64'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Upload the program itself rather than an archive of it.
      - name: Rename
        run: |
          mkdir -p ../dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} ../dist/translate-companion-${{ matrix.name }}$ext

      - uses: actions/upload-artifact@v7
        with:
          path: dist/translate-companion-${{ matrix.name }}*
          archive: false

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/translate-companion-${{ matrix.name }}*

  addon:
    name: Addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          for f in addon/Translate/*.lua; do luac5.1 -p "$f"; done
      # GitHub zips folder artifacts once on download; the zip holds the Translate folder.
      - uses: actions/upload-artifact@v7
        with:
          name: Translate-addon
          path: addon/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd addon && zip -r ../Translate-addon.zip Translate

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Translate-addon.zip
