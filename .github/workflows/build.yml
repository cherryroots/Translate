name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this run as a release with this tag, such as v0.1.0. Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write

# The release tag (v1.2.3), from a manual run's release box or a v* tag push.
# Empty for plain builds.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  # For a release, writes the tag's version into the .toc, Cargo.toml and
  # Cargo.lock, commits that to the branch the run started from (main for a
  # tag push) and hands the new commit to the build jobs. Otherwise it only
  # passes the triggering commit through.
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG != '' && (github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch) || github.sha }}

      - name: Set version from release tag
        run: .github/scripts/set-version.sh

      # Pushes made with GITHUB_TOKEN don't start another workflow run.
      - name: Commit the version
        id: commit
        run: |
          if [ -n "$TAG" ] && ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $TAG"
            git push origin "HEAD:${BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}

  companion:
    name: Companion (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: translate-companion.exe
          # One job builds both Mac architectures and joins them with lipo,
          # so only one macOS runner is queued.
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
            exe: translate-companion
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: translate-companion
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion -> target
          key: ${{ matrix.name }}

      # xcap's Linux screen capture links against PipeWire and X11/Wayland.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpipewire-0.3-dev libclang-dev pkg-config \
            libxcb1-dev libxrandr-dev libdbus-1-dev libwayland-dev libegl-dev libgbm-dev

      - name: Test
        if: matrix.name == 'linux-x64'
        run: cargo test --locked

      - name: Build
        run: |
          for t in ${MATRIX_TARGET//,/ }; do
            cargo build --release --locked --target "$t"
          done
        env:
          MATRIX_TARGET: ${{ matrix.target }}

      # Upload the program itself rather than an archive of it.
      - name: Rename
        run: |
          mkdir -p ../dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          out=../dist/translate-companion-${{ matrix.name }}$ext
          bins=()
          for t in ${MATRIX_TARGET//,/ }; do bins+=("target/$t/release/${{ matrix.exe }}"); done
          if [ ${#bins[@]} -gt 1 ]; then lipo -create -output "$out" "${bins[@]}"; else cp "${bins[0]}" "$out"; fi
        env:
          MATRIX_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          path: dist/translate-companion-${{ matrix.name }}*
          archive: false

  addon:
    name: Addon
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          for f in addon/Translate/*.lua; do luac5.1 -p "$f"; done
      # GitHub zips folder artifacts once on download; the zip holds the Translate folder.
      - uses: actions/upload-artifact@v7
        with:
          name: Translate-addon
          path: addon/

  # Gathers every build into one release. On pull requests and plain builds
  # it only checks that the files are there; it publishes for a v* tag push,
  # or a manual run given a tag (which creates the tag on the version commit).
  release:
    name: Release
    needs: [version, companion, addon]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Zip the addon
        run: |
          cd dist
          zip -qr Translate-addon.zip Translate
          rm -r Translate
          ls -l
          for f in Translate-addon.zip translate-companion-windows-x64.exe translate-companion-macos-universal translate-companion-linux-x64; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Publish
        if: env.TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.version.outputs.sha }}
          generate_release_notes: true
          files: dist/*
