[package]
name = "translate-companion"
version = "0.1.0"
edition = "2021"
description = "Reads the WoW chat log, translates Chinese chat to English, and shows it in an overlay."
license = "MIT"

[dependencies]
eframe = "0.36"
arboard = "3.6"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
strip = true
